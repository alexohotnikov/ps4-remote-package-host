<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 · RPI Sender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6af7'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b10; --surface: #14141c; --surface2: #1c1c27; --surface3: #252533;
    --border: #2a2a3a; --border-hi: #3a3a52;
    --accent: #7c6af7; --accent-soft: rgba(124, 106, 247, .14);
    --cyan: #4fd1c5; --text: #ececf4; --muted: #8a8aa6; --faint: #5c5c78;
    --green: #5ad08a; --green-soft: rgba(90, 208, 138, .14);
    --red: #f27b7b; --red-soft: rgba(242, 123, 123, .14);
    --amber: #f2c46b;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 15px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 15% -10%, rgba(124, 106, 247, .16), transparent 70%),
      radial-gradient(700px 380px at 100% 0%, rgba(79, 209, 197, .08), transparent 70%),
      var(--bg);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 14px; flex: 1 1 320px; min-width: 0; }
  .brand > div:last-child { min-width: 0; }
  .logo {
    flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #5a8bf7); font-weight: 800; font-size: 15px;
    box-shadow: 0 6px 24px rgba(124, 106, 247, .35);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .root { color: var(--muted); font-size: 12px; font-family: var(--mono); word-break: break-all; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 999px; font-size: 13px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.on { color: var(--green); border-color: rgba(90, 208, 138, .35); background: var(--green-soft); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .pill.off { color: var(--red); border-color: rgba(242, 123, 123, .35); background: var(--red-soft); }
  .pill.off .dot { background: var(--red); }
  .pill.busy .dot { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .card {
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px; backdrop-filter: blur(8px);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .step {
    width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700;
  }
  .meta { color: var(--muted); font-size: 13px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-size: 12px; color: var(--muted); }
  .inline { display: flex; gap: 8px; }
  .inline > input { flex: 1; min-width: 0; }

  input[type=text], input[type=search], select, textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; width: 100%;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #ps4ip { font-family: var(--mono); }

  button {
    background: var(--accent); color: #fff; border: 1px solid transparent; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: filter .15s, background .15s, transform .05s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost { background: var(--surface2); color: var(--text); border-color: var(--border); }
  button.ghost:hover { background: var(--surface3); filter: none; }
  button.icon { padding: 8px 10px; font-weight: 500; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; filter: none; transform: none; }

  .toolbar { display: flex; gap: 8px; flex: 1; justify-content: flex-end; min-width: 240px; }
  .toolbar input { max-width: 280px; }

  .files { display: flex; flex-direction: column; gap: 8px; }
  .file {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; transition: border-color .15s;
  }
  .file:hover { border-color: var(--border-hi); }
  .file.sent { border-color: rgba(90, 208, 138, .45); }
  .file.failed { border-color: rgba(242, 123, 123, .45); }
  .file .info { min-width: 0; }
  .file .name { font-size: 14px; font-weight: 500; word-break: break-all; }
  .file .sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .badge {
    font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .file .actions { display: flex; gap: 6px; align-items: center; }
  .file .url { grid-column: 1 / -1; font: 11px var(--mono); color: var(--faint); word-break: break-all; }
  @media (max-width: 560px) {
    .file { grid-template-columns: 1fr; }
    .file .actions { justify-content: flex-end; }
  }

  .empty {
    color: var(--muted); font-size: 14px; text-align: center; padding: 34px 12px;
    border: 1px dashed var(--border); border-radius: 12px;
  }
  .empty b { color: var(--text); font-weight: 500; }

  #log {
    background: #08080c; border: 1px solid var(--border); border-radius: 10px;
    font: 12px/1.7 var(--mono); padding: 12px 14px; height: 200px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; color: var(--muted);
  }
  #log .t { color: var(--faint); }
  #log .ok { color: var(--green); } #log .err { color: var(--red); } #log .ev { color: var(--cyan); }

  details { margin-top: 14px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  details summary:hover { color: var(--text); }
  textarea { font: 13px var(--mono); min-height: 80px; margin-top: 10px; resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--surface3); border: 1px solid var(--border-hi); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">PS4</div>
      <div>
        <h1>RPI Sender</h1>
        <div class="root" id="root">…</div>
      </div>
    </div>
    <div class="pill" id="status"><span class="dot"></span><span id="statusText">консоль не проверена</span></div>
  </header>

  <section class="card">
    <div class="card-head">
      <div class="title"><span class="step">1</span>Подключение</div>
    </div>
    <div class="grid2">
      <label class="field">
        <span>IP PS4 (Настройки → Сеть → Статус соединения)</span>
        <div class="inline">
          <input type="text" id="ps4ip" placeholder="192.168.1.42" inputmode="decimal" autocomplete="off">
          <button class="ghost" id="ping">Проверить</button>
        </div>
      </label>
      <label class="field">
        <span>Адрес мака, с которого PS4 будет качать</span>
        <select id="hostip"></select>
      </label>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="title"><span class="step">2</span>Пакеты <span class="meta" id="summary"></span></div>
      <div class="toolbar">
        <input type="search" id="filter" placeholder="Поиск…">
        <button class="ghost" id="refresh">Обновить</button>
      </div>
    </div>
    <div class="files" id="files"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <div class="card-head"><div class="title">Прямая ссылка</div></div>
      <div class="inline">
        <input type="text" id="directUrl" placeholder="http://…/game.pkg">
        <button id="directSend">На PS4</button>
      </div>
      <div class="hint">PS4 скачает по ссылке сама, мак в передаче не участвует.</div>
      <details>
        <summary>Advanced: сырая JSON-команда</summary>
        <textarea id="rawJson">{ "method": "activate", "params": { "url": "http://…" } }</textarea>
        <button class="ghost" id="rawSend" style="margin-top:10px">Отправить как есть</button>
      </details>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="title">Лог</div>
        <button class="ghost icon" id="clearLog">Очистить</button>
      </div>
      <div id="log"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { ips: [], files: [], port: Number(location.port) || 80, hostIp: null, busy: false };
const rowState = new Map();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function el(tag, props = {}, children = []) {
  const n = Object.assign(document.createElement(tag), props);
  for (const c of [].concat(children)) n.append(c);
  return n;
}

function log(msg, cls) {
  const box = $('log');
  box.append(el('span', { className: 't', textContent: new Date().toLocaleTimeString() + '  ' }),
             el('span', { className: cls || '', textContent: msg }), '\n');
  box.scrollTop = box.scrollHeight;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function fmtSize(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(1) + ' MB';
  return Math.max(1, Math.round(b / 1e3)) + ' KB';
}

function fmtDate(ms) {
  return new Date(ms).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function titleId(name) {
  return (/([A-Z]{4}\d{5})/.exec(name) || [])[1];
}

function fileUrl(name) {
  const host = state.hostIp || 'localhost';
  return `http://${host}:${state.port}/pkg/${encodeURIComponent(name)}`;
}

function setStatus(kind, text) {
  $('status').className = 'pill ' + (kind || '');
  $('statusText').textContent = text;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || 'HTTP ' + r.status);
  return body;
}

async function loadState() {
  try {
    const s = await api('/api/state');
    Object.assign(state, { ips: s.ips, files: s.files, port: s.port || state.port });
    $('root').textContent = s.root;

    const saved = store.get('hostIp');
    if (!state.ips.includes(state.hostIp)) {
      state.hostIp = state.ips.includes(saved) ? saved : state.ips[0] || null;
    }
    const sel = $('hostip');
    sel.replaceChildren(...state.ips.map((ip) => el('option', { value: ip, textContent: ip })));
    if (!state.ips.length) sel.append(el('option', { textContent: 'нет LAN-адресов — мак в сети?' }));
    sel.value = state.hostIp || '';
    renderFiles();
  } catch (e) {
    log('Не достучался до сервера: ' + e.message, 'err');
  }
}

function renderFiles() {
  const box = $('files');
  const q = $('filter').value.trim().toLowerCase();
  const list = state.files.filter((f) => f.name.toLowerCase().includes(q));
  const total = state.files.reduce((s, f) => s + f.size, 0);
  $('summary').textContent = state.files.length ? `${state.files.length} · ${fmtSize(total)}` : '';

  if (!state.files.length) {
    box.replaceChildren(el('div', { className: 'empty', innerHTML: 'В папке нет <b>.pkg</b> — закинь файлы и жми «Обновить»' }));
    return;
  }
  if (!list.length) {
    box.replaceChildren(el('div', { className: 'empty', textContent: 'Ничего не найдено' }));
    return;
  }

  box.replaceChildren(...list.map((f) => {
    const url = fileUrl(f.name);
    const id = titleId(f.name);
    const st = rowState.get(f.name);

    const sub = el('div', { className: 'sub' });
    if (id) sub.append(el('span', { className: 'badge', textContent: id }));
    sub.append(el('span', { textContent: fmtSize(f.size) }), el('span', { textContent: '·' }),
               el('span', { textContent: fmtDate(f.mtime) }));

    const copy = el('button', { className: 'ghost icon', textContent: 'Ссылка', title: 'Скопировать URL' });
    copy.onclick = () => copyText(url);

    const install = el('button', {
      textContent: st === 'sent' ? '✓ Отправлено' : st === 'busy' ? 'Отправляю…' : '→ PS4',
      disabled: state.busy,
    });
    install.onclick = async () => {
      rowState.set(f.name, 'busy');
      renderFiles();
      rowState.set(f.name, (await send({ url })) ? 'sent' : 'failed');
      renderFiles();
    };

    return el('div', { className: 'file' + (st === 'sent' ? ' sent' : st === 'failed' ? ' failed' : '') }, [
      el('div', { className: 'info' }, [el('div', { className: 'name', textContent: f.name }), sub]),
      el('div', { className: 'actions' }, [copy, install]),
      el('div', { className: 'url', textContent: url }),
    ]);
  }));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el('textarea', { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('Ссылка скопирована');
}

function getIp() {
  const ip = $('ps4ip').value.trim();
  if (!ip) {
    log('Укажи IP PS4 (Настройки → Сеть на консоли)', 'err');
    $('ps4ip').focus();
    return null;
  }
  store.set('ps4ip', ip);
  return ip;
}

function setBusy(on) {
  state.busy = on;
  ['directSend', 'rawSend', 'ping'].forEach((id) => ($(id).disabled = on));
  renderFiles();
}

async function send(payload) {
  const ip = getIp();
  if (!ip || state.busy) return false;
  setBusy(true);
  log(`Отправляю команду на ${ip}:9090 …`);
  try {
    const s = await api('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip, ...payload }),
    });
    log('Команда ушла. Дальше PS4 качает сама — прогресс на экране консоли.', 'ok');
    (s.events || []).forEach((e) => log('PS4: ' + e, 'ev'));
    toast('Отправлено на PS4');
    return true;
  } catch (e) {
    log(`Ошибка: ${e.message} — RPI запущен? IP верный?`, 'err');
    return false;
  } finally {
    setBusy(false);
  }
}

async function ping() {
  const ip = getIp();
  if (!ip) return;
  setStatus('busy', 'проверяю…');
  $('ping').disabled = true;
  try {
    const { ok } = await api('/api/ping?ip=' + encodeURIComponent(ip));
    setStatus(ok ? 'on' : 'off', ok ? `${ip} · порт 9090 открыт` : `${ip} · нет ответа`);
    log(ok ? 'Порт 9090 открыт — RPI слушает.' : 'Порт 9090 не отвечает. Запусти RPI на PS4.', ok ? 'ok' : 'err');
  } catch (e) {
    setStatus('off', 'ошибка проверки');
    log('Проверка не удалась: ' + e.message, 'err');
  } finally {
    $('ping').disabled = state.busy;
  }
}

$('ping').onclick = ping;
$('ps4ip').onkeydown = (e) => e.key === 'Enter' && ping();
$('refresh').onclick = loadState;
$('filter').oninput = renderFiles;
$('hostip').onchange = (e) => {
  state.hostIp = e.target.value;
  store.set('hostIp', state.hostIp);
  renderFiles();
};
$('directSend').onclick = () => {
  const u = $('directUrl').value.trim();
  if (u) send({ url: u });
};
$('directUrl').onkeydown = (e) => e.key === 'Enter' && $('directSend').click();
$('rawSend').onclick = () => send({ rawJson: $('rawJson').value });
$('clearLog').onclick = () => $('log').replaceChildren();

log('Готов к работе.');
$('ps4ip').value = store.get('ps4ip') || '';
loadState().then(() => $('ps4ip').value && ping());
</script>
</body>
</html>
